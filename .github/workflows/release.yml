name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the bridge's version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/.*kPluginVersion = "\([^"]*\)".*/\1/p' plugin/src/version.h)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag is $GITHUB_REF_NAME but plugin/src/version.h says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: ./tools/package.ps1 -Version "${{ steps.version.outputs.version }}"
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          **Load it:** inject `T7RadiantBridge-<version>.dll` into a running Radiant, or, where MTPlugins runs, copy `mtplugins/T7RadiantBridge/` into `<BO3 root>/bin/plugins/`; then speak [PROTOCOL.md](https://github.com/McReaper/t7_radiant_bridge/blob/main/PROTOCOL.md) on its pipe. The [README](https://github.com/McReaper/t7_radiant_bridge#-install) has the details.
          EOF
          gh release create "$GITHUB_REF_NAME" "T7RadiantBridge-$VERSION.zip" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
